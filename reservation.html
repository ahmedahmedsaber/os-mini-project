<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Table | The Restaurant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-success navbar-dark px-3">
      <a class="navbar-brand" href="index.html">The Restaurant</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">☰</button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="reservation.html">Book a Table</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        </ul>
      </div>
    </nav>
    <h1>Book a Table</h1>
  </header>

  <main class="container">
    <section>
      <form action="#" method="post">
        <div class="mb-3">
          <label class="form-label" for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label" for="guests">Number of guests</label>
          <input id="guests" name="guests" type="number" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label" for="date">Date</label>
          <input id="date" name="date" type="date" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label" for="time">Time</label>
          <select id="time" name="time" class="form-select">
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>

        <p>Seating:</p>
        <input type="radio" id="indoor" name="seating" value="indoor">
        <label for="indoor">Indoor</label>
        <input type="radio" id="outdoor" name="seating" value="outdoor">
        <label for="outdoor">Outdoor</label><br><br>

        <input type="checkbox" id="birthday" name="birthday" value="1">
        <label for="birthday">It's a birthday</label><br><br>

        <div class="mb-3">
          <label class="form-label" for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="4" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Book Now</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 The Restaurant | Ahmed Ahmed Saber (224113179)</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
